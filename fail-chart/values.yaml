image:
  repository: wlanboy/fail
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1
deploymentName: fail

# Must be >= chaos.sigtermDelay plus a few seconds for draining in-flight
# requests (srv.Shutdown) for the SIGTERM_DELAY scenario to complete
# gracefully; set it lower than chaos.sigtermDelay to test what happens when
# the grace period is undersized (kubelet SIGKILLs the process).
terminationGracePeriodSeconds: 35

resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"  # Bei OOM_KILL wird der Pod hier gekillt
    cpu: "200m"      # Bei CPU_BURN siehst du hier Throttling

service:
  name: fail-svc
  type: ClusterIP
  port: 8080
  targetPort: 8080

chaos:
  enabled: true              # Automatischen Chaos-Zyklus aktivieren (false = nur manuelle /chaos/*-Endpunkte)
  interval: 300              # Sekunden zwischen Chaos-Zyklen
  startupDelay: 10           # Initialer Puffer beim Start
  memoryChunkSize: 1000000   # Bytes pro Memory-Chunk (1MB)
  cpuBurnThreads: 2          # Anzahl paralleler CPU-Threads
  cpuBurnDuration: 120       # Sekunden CPU-Burn Dauer (max CHAOS_INTERVAL / 2)
  slowResponseDelay: 5       # Sekunden künstliche Verzögerung pro Request (SLOW_RESPONSE)
  sigtermDelay: 30           # Sekunden bis zum sauberen Shutdown nach SIGTERM
  readinessFlapInterval: 20  # Sekunden zwischen Readiness-Toggles (READINESS_FLAP), muss > readinessProbe periodSeconds × failureThreshold (15s) sein

istio:
  gatewayName: failgo-gw
  gatewayNamespace: "istio-ingress"
  # Wie lange der Envoy-Sidecar nach SIGTERM weiter routet. Istio-Default sind
  # 5s, d.h. der Sidecar wäre lange vor dem Ende von chaos.sigtermDelay weg.
  # Sollte >= chaos.sigtermDelay sein. Leer lassen (""), um bewusst das
  # Default-Verhalten (Sidecar stirbt vor der App) zu testen.
  terminationDrainDuration: 35s
  hosts: 
    - fail.tp.lan
    - fail.gmk.lan
    - fail.localhost
  tls:
    enabled: true
    secretName: fail-tls

certManager:
  enabled: true
  issuerRef:
    kind: ClusterIssuer
    name: "local-ca-issuer"
  dnsNames:
    - fail.tp.lan
    - fail.gmk.lan
    - fail.localhost
